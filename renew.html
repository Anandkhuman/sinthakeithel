<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecting to Payment - Sintha Developer</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h2 {
            font-size: 1.8rem;
            color: #00ffcc;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        /* Loading Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 255, 204, 0.2);
            border-top-color: #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fallback Button */
        .btn-pay {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00ffcc, #00c6ff);
            color: #002233;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
            display: none; /* Hidden by default */
        }

        .secure-badge {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>Processing Renewal...</h2>
    <p>Please wait while we redirect you to the secure payment gateway (₹4,000).</p>

    <!-- Agar browser auto-popup block kare toh ye button dikhega -->
    <button class="btn-pay" id="fallbackBtn" onclick="openRazorpay()">Pay ₹4,000 Now</button>

    <div class="secure-badge">🔒 Secured by Razorpay</div>

    <!-- ================= JAVASCRIPT & FIREBASE ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDrfrgYYY69ufupGKbktPDY0jtKKVOzR-0",
            authDomain: "manipurhousie-45674.firebaseapp.com",
            databaseURL: "https://manipurhousie-45674-default-rtdb.firebaseio.com",
            projectId: "manipurhousie-45674",
            storageBucket: "manipurhousie-45674.appspot.com",
            messagingSenderId: "887925712516",
            appId: "1:887925712516:web:b03d27f5759dd5719c84d1"
        };

        const app = initializeApp(firebaseConfig);
        const centralDB = getDatabase(app);
        const FIXED_AMOUNT = 4000;

        // Razorpay Options
        var options = {
            key: "rzp_live_SUarhYm5IfBTar", // Aapka Live Key
            amount: FIXED_AMOUNT * 100, // Amount in paise
            currency: "INR",
            name: "Sintha Developer",
            description: "Website Renewal Fee",
            handler: async function(response) {
                // Payment Success hone par:
                
                // 1. Firebase me save karna (Bina details ke)
                try {
                    await set(push(ref(centralDB, 'transactions')), {
                        amount: FIXED_AMOUNT,
                        date: new Date().getTime(),
                        type: "renewal_direct",
                        paymentId: response.razorpay_payment_id,
                        isDistributed: false
                    });
                } catch(e) {
                    console.error("Firebase Error:", e);
                }

                // 2. Direct WhatsApp par bhejna
                const msg = `✅ Website Renewal Payment Successful!\n\nAmount: ₹${FIXED_AMOUNT}\nPayment ID: ${response.razorpay_payment_id}\n\nPlease reactivate my website.`;
                window.location.href = "https://wa.me/919366193440?text=" + encodeURIComponent(msg);
            },
            theme: {
                color: "#0f2027"
            }
        };

        var rzp = new Razorpay(options);

        // Fail hone par
        rzp.on('payment.failed', function (response){
            alert("Payment Failed! Please try again.");
            document.getElementById("fallbackBtn").style.display = "inline-block"; // Button show kar do
        });

        // Global function for fallback button
        window.openRazorpay = function() {
            rzp.open();
        };

        // AUTO-REDIRECT Logic (Page load hote hi 1.5 second baad popup khulega)
        window.onload = function() {
            setTimeout(() => {
                rzp.open();
                // Backup ke liye 3 seconds baad button dikha do (in case popup block ho jaye)
                setTimeout(() => {
                    document.getElementById("fallbackBtn").style.display = "inline-block";
                }, 3000);
            }, 1500); 
        };
    </script>
</body>
</html>

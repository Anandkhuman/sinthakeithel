<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - SINTHA HOUSIE</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --primary: #00f6ff;
            --secondary: #ff00a0;
            --surface: #151a28;
            --text-light: #f8fafc;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #07090d, #1a2035);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background glow effects */
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 246, 255, 0.05) 0%, transparent 50%);
            animation: pulse-bg 8s infinite alternate;
            z-index: 0;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .payment-card {
            background: rgba(21, 26, 40, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 246, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 246, 255, 0.1);
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            position: relative;
            z-index: 1;
            opacity: 0; /* Hidden for GSAP */
            transform: translateY(30px); /* Hidden for GSAP */
        }

        .payment-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% auto;
            animation: gradient-flow 3s linear infinite;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 246, 255, 0.4);
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .details-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .detail-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .detail-label { color: #cbd5e1; font-weight: 500; font-size: 0.9rem; }
        .detail-value { font-weight: bold; color: #fff; font-size: 0.95rem; text-align: right; }

        .ticket-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
            max-width: 60%;
        }

        .ticket-chip {
            background: linear-gradient(135deg, var(--secondary), #b30059);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(255, 0, 160, 0.3);
        }

        .amount-display {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(0, 246, 255, 0.5);
            animation: pulse-amount 2s infinite;
        }

        @keyframes pulse-amount {
            0%, 100% { transform: scale(1); text-shadow: 0 0 15px rgba(0, 246, 255, 0.5); }
            50% { transform: scale(1.05); text-shadow: 0 0 25px rgba(0, 246, 255, 0.8); }
        }

        .pay-btn {
            background: linear-gradient(45deg, var(--primary), #00ff88);
            color: var(--bg-color);
            border: none;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0, 246, 255, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .pay-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .pay-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 246, 255, 0.6);
            filter: brightness(1.1);
        }

        .pay-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            animation: none;
        }
        .pay-btn:disabled::after { display: none; }

        /* Loader */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Success Animation */
        .success-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(21, 26, 40, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        .success-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .checkmark-circle {
            width: 80px; height: 80px;
            position: relative;
            display: inline-block;
            vertical-align: top;
            margin-bottom: 20px;
        }
        .checkmark-circle .background {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: var(--success);
            position: absolute;
            transform: scale(0);
        }
        .checkmark-circle .checkmark {
            border-radius: 5px;
        }
        .checkmark-circle .checkmark.draw:after {
            animation-duration: 800ms;
            animation-timing-function: ease;
            animation-name: checkmark;
            transform: scaleX(-1) rotate(135deg);
        }
        .checkmark-circle .checkmark:after {
            opacity: 1;
            height: 40px; width: 20px;
            transform-origin: left top;
            border-right: 4px solid white;
            border-top: 4px solid white;
            content: '';
            left: 20px; top: 40px;
            position: absolute;
        }

        @keyframes checkmark {
            0% { height: 0; width: 0; opacity: 1; }
            20% { height: 0; width: 20px; opacity: 1; }
            40% { height: 40px; width: 20px; opacity: 1; }
            100% { height: 40px; width: 20px; opacity: 1; }
        }
        .success-text {
            color: var(--success);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: bold;
            transform: translateY(20px);
            opacity: 0;
        }

    </style>
</head>
<body>

    <div class="payment-card" id="paymentCard">
        <!-- Initial Loader -->
        <div id="loaderState" class="loader-container">
            <div class="loader"></div>
            <p style="color: var(--primary); font-weight: bold; letter-spacing: 1px;">Fetching Details...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" style="display: none; padding: 20px 0;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--danger); margin-bottom: 15px;"></i>
            <h2 style="color: var(--danger); font-family: 'Rajdhani', sans-serif; margin-bottom: 10px;">Link Expired or Invalid</h2>
            <p style="color: #94a3b8; font-size: 0.9rem;">The payment request is no longer valid or has already been completed.</p>
            <button class="pay-btn" style="margin-top: 20px; background: #334155; box-shadow: none;" onclick="window.location.href='index.html'">Go Back</button>
        </div>

        <!-- Payment Details State -->
        <div id="paymentState" style="display: none;">
            <h1>Checkout</h1>
            <p class="subtitle">Complete your secure booking</p>

            <div class="details-box">
                <div class="detail-item">
                    <span class="detail-label">Name</span>
                    <span class="detail-value" id="dispName">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Mobile</span>
                    <span class="detail-value" id="dispPhone">-</span>
                </div>
                <div class="detail-item" style="align-items: flex-start;">
                    <span class="detail-label" style="margin-top: 5px;">Tickets</span>
                    <div class="ticket-chips" id="dispTickets">
                        <!-- Chips will be injected here -->
                    </div>
                </div>
            </div>

            <div class="amount-display">
                ₹<span id="dispAmount">0</span>
            </div>

            <button class="pay-btn" id="payBtn" onclick="initiateRazorpay()">
                <i class="fas fa-lock" style="margin-right: 8px;"></i> Pay Now
            </button>
            <div style="margin-top: 15px; font-size: 0.8rem; color: #64748b; display: flex; justify-content: center; align-items: center; gap: 5px;">
                <i class="fas fa-shield-alt"></i> Secured by Razorpay
            </div>
        </div>

        <!-- Success Overlay -->
        <div class="success-overlay" id="successOverlay">
            <div class="checkmark-circle">
                <div class="background" id="successBg"></div>
                <div class="checkmark draw" id="successCheck" style="display:none;"></div>
            </div>
            <div class="success-text" id="successText">Payment Successful!</div>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 10px; opacity: 0;" id="redirectText">Booking confirmed. Redirecting...</p>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION (Same as index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyBxtWgmOPaFY1tq1mHHYOC5IRtV_gIIFuQ",
            authDomain: "sinthahousiev5.firebaseapp.com",
            databaseURL: "https://sinthahousiev5-default-rtdb.firebaseio.com",
            projectId: "sinthahousiev5",
            storageBucket: "sinthahousiev5.firebasestorage.app",
            messagingSenderId: "847328700536",
            appId: "1:847328700536:web:180eba328bcd5e6485258d",
            measurementId: "G-L6CPQFGSRH"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // RAZORPAY LIVE KEY
        const RAZORPAY_KEY = "rzp_live_SUarhYm5IfBTar";

        // Global Variables
        let paymentData = null;
        const urlParams = new URLSearchParams(window.location.search);
        const payId = urlParams.get('payId');

        // GSAP Entry Animation
        gsap.to("#paymentCard", {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: "back.out(1.2)",
            delay: 0.2
        });

        document.addEventListener("DOMContentLoaded", async () => {
            if (!payId) {
                showError();
                return;
            }

            try {
                const snapshot = await db.ref(`pendingPayments/${payId}`).once('value');
                if (!snapshot.exists()) {
                    showError();
                    return;
                }

                paymentData = snapshot.val();
                
                // Prevent duplicate payments if status is already completed
                if (paymentData.status === 'completed') {
                    showError();
                    return;
                }

                populateUI(paymentData);
            } catch (error) {
                console.error(error);
                showError();
            }
        });

        function populateUI(data) {
            document.getElementById('dispName').textContent = data.name;
            document.getElementById('dispPhone').textContent = data.phone;
            document.getElementById('dispAmount').textContent = data.amount;

            const chipsContainer = document.getElementById('dispTickets');
            chipsContainer.innerHTML = data.tickets.map(t => `<span class="ticket-chip">${t}</span>`).join('');

            // Hide loader, Show Details with smooth GSAP fade
            gsap.to("#loaderState", { opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('loaderState').style.display = 'none';
                document.getElementById('paymentState').style.display = 'block';
                gsap.fromTo("#paymentState", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 });
            }});
        }

        function showError() {
            gsap.to("#loaderState", { opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('loaderState').style.display = 'none';
                document.getElementById('paymentState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                gsap.fromTo("#errorState", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" });
            }});
        }

        function initiateRazorpay() {
            if (!paymentData) return;

            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const options = {
                "key": RAZORPAY_KEY,
                "amount": paymentData.amount * 100, // Amount in paise
                "currency": "INR",
                "name": "SINTHA HOUSIE",
                "description": "Ticket Booking Payment",
                "image": "https://raw.githubusercontent.com/Anandkhuman/Photo/main/logo1.png",
                "handler": function (response) {
                    // Payment successful callback
                    handleSuccessfulPayment(response.razorpay_payment_id);
                },
                "prefill": {
                    "name": paymentData.name,
                    "contact": paymentData.phone
                },
                "theme": {
                    "color": "#00f6ff"
                },
                "modal": {
                    "ondismiss": function() {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-lock" style="margin-right: 8px;"></i> Pay Now';
                    }
                }
            };
            
            const rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock" style="margin-right: 8px;"></i> Pay Now';
            });
            rzp1.open();
        }

        async function handleSuccessfulPayment(paymentId) {
            playSuccessAnimation();

            try {
                // 1. Update Tickets as Sold
                const updates = {};
                const timestamp = firebase.database.ServerValue.TIMESTAMP;
                paymentData.tickets.forEach(id => {
                    updates[`/tickets/${id}/is_sold`] = true;
                    updates[`/tickets/${id}/owner_name`] = paymentData.name;
                    updates[`/tickets/${id}/owner_name_lower`] = paymentData.name.toLowerCase();
                    updates[`/tickets/${id}/owner_phone`] = paymentData.phone;
                    updates[`/tickets/${id}/agent_uid`] = paymentData.agentUid;
                    updates[`/tickets/${id}/sold_at`] = timestamp;
                    updates[`/tickets/${id}/payment_id`] = paymentId; // Store Razorpay ID for records
                });

                // 2. Mark pending payment as completed (or remove it)
                updates[`/pendingPayments/${payId}`] = null;

                // Execute DB updates
                await db.ref().update(updates);

                // Add to global notification
                await db.ref('gameState/lastAction').set({
                    message: `${paymentData.tickets.length} ticket(s) booked via Online Payment.`,
                    type: 'success',
                    timestamp: timestamp
                });

                // Redirect back to main page after animation completes (3 seconds)
                setTimeout(() => {
                    window.location.replace(`index.html?payment_success=true`);
                }, 3000);

            } catch (error) {
                console.error("Database update error post-payment: ", error);
                alert("Payment received but error updating tickets. Please contact Admin with Payment ID: " + paymentId);
                window.location.replace(`index.html`);
            }
        }

        function playSuccessAnimation() {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');

            const tl = gsap.timeline();
            
            // Pop the green circle
            tl.to("#successBg", { scale: 1, duration: 0.4, ease: "back.out(1.5)" })
              // Draw the checkmark
              .call(() => document.getElementById('successCheck').style.display = 'block')
              // Bring up the text
              .to("#successText", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, "+=0.3")
              // Show redirect text
              .to("#redirectText", { opacity: 1, duration: 0.4 }, "+=0.2");
        }
    </script>
</body>
</html>
